name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the APK under (created if missing)
        default: v1.0.0
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run check

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Sign the release build with the project keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" -a -n "$KEYSTORE_PASSWORD" || { echo "Signing secrets are missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          release = """        release {
            storeFile file(System.getenv('LEITNER_KEYSTORE'))
            storePassword System.getenv('LEITNER_KEYSTORE_PASSWORD')
            keyAlias 'leitner'
            keyPassword System.getenv('LEITNER_KEYSTORE_PASSWORD')
            storeType 'PKCS12'
        }
"""
          assert 'signingConfigs {' in s
          s = s.replace('signingConfigs {\n', 'signingConfigs {\n' + release, 1)
          # only the release build type switches away from the debug key
          s, n = re.subn(r'(release \{[^}]*?)signingConfig signingConfigs\.debug', r'\1signingConfig signingConfigs.release', s, count=1, flags=re.S)
          assert n == 1, 'release signingConfig not patched'
          open(p, 'w').write(s)
          g = 'android/gradle.properties'
          t = open(g).read().replace('-Xmx2048m', '-Xmx4096m')
          t = re.sub(r'reactNativeArchitectures=.*', 'reactNativeArchitectures=arm64-v8a,armeabi-v7a', t)
          open(g, 'w').write(t)
          PY
          echo "LEITNER_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "LEITNER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature and collect the APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$SRC" leitner-ielts.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs leitner-ielts.apk | tee certs.txt
          grep -q "Leitner IELTS" certs.txt || { echo "APK is not signed with the project key"; exit 1; }
          sha256sum leitner-ielts.apk | tee leitner-ielts.apk.sha256
          echo "size=$(du -h leitner-ielts.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: leitner-ielts-apk
          path: |
            leitner-ielts.apk
            leitner-ielts.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          SHA=$(cut -d' ' -f1 leitner-ielts.apk.sha256)
          {
            echo "## لایتنر آیلتس — Android APK"
            echo
            echo "- Install: download \`leitner-ielts.apk\`, allow \"install unknown apps\" for your browser or file manager, then open it."
            echo "- Android 7.0+ (arm64 and armv7 phones). Size: $SIZE."
            echo "- All data stays on your phone. AI is optional: connect your own API key in Settings."
            echo "- SHA-256: \`$SHA\`"
          } > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "لایتنر آیلتس $TAG" --notes-file notes.md
          gh release upload "$TAG" leitner-ielts.apk leitner-ielts.apk.sha256 --clobber
          gh release edit "$TAG" --notes-file notes.md
